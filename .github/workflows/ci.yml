name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ветку отменяет предыдущий прогон — он уже неактуален.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Бэкенд — линт, миграции, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitness_clubs_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: fitness_clubs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked падает, если uv.lock разошёлся с pyproject.toml.
      - name: Установка зависимостей
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Django check
        run: uv run python manage.py check

      - name: Незакоммиченные миграции
        run: uv run python manage.py makemigrations --check --dry-run

      # requirements.txt — артефакт, его собирает `uv export` из uv.lock.
      # Если забыли пересобрать, образ поедет со старыми версиями.
      - name: requirements.txt соответствует uv.lock
        run: |
          uv export --no-dev --frozen --no-emit-project --no-hashes --no-header \
            > /tmp/requirements.expected.txt
          # Свой заголовок файла при сравнении отбрасываем, пины сверяем целиком.
          diff -u <(grep -v '^# ' requirements.txt) /tmp/requirements.expected.txt
        shell: bash

      - name: Тесты
        run: uv run python manage.py test --verbosity 2

  frontend:
    name: Фронтенд — линт и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci падает, если package-lock.json разошёлся с package.json
      # или если в нём битые хеши целостности.
      - name: Установка зависимостей
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Сборка
        run: npm run build

  docker:
    name: Docker — сборка образа
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Образ не публикуем: задача — поймать поломку Dockerfile до мержа.
      - name: Сборка backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: fitness-clubs-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ стартует и отвечает
        run: |
          docker run -d --name api \
            -e SECRET_KEY=ci-secret-key-not-for-production \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -p 8000:8000 \
            fitness-clubs-backend:ci
          for _ in $(seq 1 30); do
            # Страница Swagger UI не обращается к базе, зато рендерится через
            # ManifestStaticFilesStorage — заодно проверяем collectstatic.
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/schema/docs/; then
              echo "gunicorn отвечает, статика на месте"
              docker rm -f api > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Образ не ответил за 30 секунд"
          docker logs api
          exit 1

      - name: Проверка, что контейнер не от root
        run: |
          user=$(docker run --rm fitness-clubs-backend:ci id -un)
          echo "Пользователь в контейнере: $user"
          test "$user" != "root"

  e2e:
    name: E2E — сквозные сценарии
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitness_clubs_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      POSTGRES_DB: fitness_clubs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      API_PORT: "8001"
      E2E_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Установка зависимостей
        run: |
          uv sync --locked --project backend
          npm ci --prefix client

      - name: Миграции и демо-данные
        working-directory: backend
        run: |
          uv run python manage.py migrate
          uv run python manage.py seed_demo

      - name: Запуск API
        working-directory: backend
        run: |
          nohup uv run python manage.py runserver 127.0.0.1:"$API_PORT" --noreload \
            > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$API_PORT/api/v1/clubs/" > /dev/null; then
              echo "API поднят"
              exit 0
            fi
            sleep 1
          done
          echo "API не ответил за 30 секунд"
          cat /tmp/api.log
          exit 1

      - name: Сборка фронтенда
        working-directory: client
        env:
          VITE_API_URL: http://127.0.0.1:${{ env.API_PORT }}/api/v1
        run: npm run build

      - name: Установка браузера
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Статику раздаёт `vite preview`: проверяем ровно тот билд, который уедет в прод.
      - name: Запуск preview
        working-directory: client
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "$E2E_BASE_URL" > /dev/null; then
              echo "Фронтенд поднят"
              exit 0
            fi
            sleep 1
          done
          echo "Фронтенд не ответил за 30 секунд"
          cat /tmp/preview.log
          exit 1

      - name: Playwright
        working-directory: client
        run: npx playwright test

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
